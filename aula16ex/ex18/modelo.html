<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <style>
        body {
            background-color: rgba(20, 20, 223, 0.658);
            font-size: 1.3em;
            text-align: center;

        }

        header {
            color: white;
        }

        section {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            width: 500px;
            margin: auto;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.363);
        }

         .esquerda {
            margin-top: 8px;
            display: block;
            text-align: left;

        }
        select {
            padding-bottom: 50px;
            padding-right: 30px;
        }

        footer {
            color: white;
            font-style: italic;
        }
    </style>
</head>
<body>
       <header>
            <h1>Analisador de Números</h1>
        </header>
    <main>
        <section>
            <div>Números (entre 1 e 100): <input type="number" name="" id="numero"> <button id="adicionar_botao" >Adicionar</button></div>
            <div><select name="" id="tab_select" class="esquerda" size="5"></select></div>
            <div><button id="finalizar_botao" class="esquerda">Finalizar</button></div>
            <div id="res" class="esquerda"></div>
        </section>
    </main>

    <footer>&copy; Curso em vídeo</footer>
    
    <script src="script.js"></script>
</body>
</html>
